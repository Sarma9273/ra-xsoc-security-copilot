[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ra-xsoc-engine"
version = "0.1.0"
description = "Core domain and AI engine for the RA-XSOC security operations copilot."
requires-python = ">=3.11"
authors = [
    { name = "Guru Charan Mavuduru" }
]
dependencies = [
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
ml = [
    "sentence-transformers>=5,<6",
    "faiss-cpu>=1.12,<2",
]

[tool.setuptools]
package-dir = {"" = "src"}
[tool.setuptools.packages.find]
where = ["src"]
