name: RA-XSOC-X Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 1.0.0"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install and validate
        run: |
          python -m pip install --upgrade pip
          pip install -e "./packages/ra_xsoc_engine[ai]"
          pip install -e "./packages/ra_xsoc_api"
          pip install pytest httpx psycopg[binary] sqlalchemy
          python ./scripts/generate_retrieval_corpus.py
          python ./scripts/generate_embeddings.py
          python -m pytest -q
          python ./research/evaluate_retrieval.py
      - name: Create release tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "RA-XSOC-X ${VERSION}"
          git push origin "v${VERSION}"
