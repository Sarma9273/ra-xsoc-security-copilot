name: RA-XSOC-X CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install
      - run: npm run lint
      - run: npm run build
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "./packages/ra_xsoc_engine[ai]" faiss-cpu
      - run: python -m pip install -e ./packages/ra_xsoc_api
      - run: python -m pip install -U "setuptools>=83" pytest httpx psycopg[binary] sqlalchemy
      - run: python ./scripts/generate_retrieval_corpus.py data/knowledge_base/normalized data/retrieval
      - run: python ./scripts/generate_embeddings.py
      - run: python -m pytest -q
      - run: python -m pip install ruff
      - run: ruff check packages tests
      - name: Reproducible benchmark
        run: |
          python ./research/evaluate_retrieval.py
          test -f research/results/ra_xsoc_x_v1_results.json
