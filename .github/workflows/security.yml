name: RA-XSOC-X Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install security tooling
        run: python -m pip install --upgrade pip pip-audit

      - name: Install project dependencies
        run: |
          python -m pip install -e "./packages/ra_xsoc_engine[ai]"
          python -m pip install -e "./packages/ra_xsoc_api"

      - name: Audit Python dependencies
        run: pip-audit

      - name: Scan repository for likely secrets
        run: |
          if grep -RInE --exclude-dir=.git --exclude='*.lock' --exclude='*.md'             '(^|[^A-Za-z])(sk-[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY-----)' .; then
            echo "Potential secret material detected."
            exit 1
          fi
