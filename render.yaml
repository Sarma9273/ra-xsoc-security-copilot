services:
  - type: web
    name: ra-xsoc-api
    runtime: python
    plan: free
    region: singapore
    branch: master
    buildCommand: pip install ./packages/ra_xsoc_engine ./packages/ra_xsoc_api
    startCommand: uvicorn ra_xsoc_api.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: RA_XSOC_ENVIRONMENT
        value: production
      - key: RA_XSOC_DEPLOYMENT_PROFILE
        value: lightweight
      - key: RA_XSOC_LIGHTWEIGHT_RETRIEVAL
        value: "true"
      - key: RA_XSOC_ALLOW_HEAVY_ML
        value: "false"
      - key: RA_XSOC_CORS_ENABLED
        value: "true"
      - key: RA_XSOC_CORS_ORIGINS
        value: https://sarma9273.github.io
